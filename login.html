<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sign In · USDT Cloud Miner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #134E4A 0%, #042F2E 40%, #021C1B 100%);
    color: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(20, 184, 166, 0.25);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 30px rgba(13, 148, 136, 0.15);
  }
  .brand-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 32px;
  }
  .brand-logo {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 16px rgba(15, 118, 110, 0.35);
    margin-bottom: 16px;
  }
  .form-group {
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: #CCFBF1;
    letter-spacing: 0.02em;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    color: #64748B;
    pointer-events: none;
  }
  .form-input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 44px;
    background: rgba(2, 44, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease;
  }
  .form-input:focus {
    border-color: #14B8A6;
    background: rgba(2, 44, 42, 0.85);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.25);
  }
  .toggle-password {
    position: absolute;
    right: 14px;
    background: transparent;
    border: none;
    color: #64748B;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .toggle-password:hover {
    color: #94A3B8;
  }
  .btn-submit {
    width: 100%;
    height: 48px;
    margin-top: 10px;
    background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
    border: none;
    border-radius: 12px;
    color: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(15, 118, 110, 0.4);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(15, 118, 110, 0.55);
  }
  .btn-submit:active {
    transform: translateY(0);
  }
  .btn-submit:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  .alert-error {
    display: none;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #FCA5A5;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    align-items: center;
    gap: 10px;
  }
  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    text-align: center;
    color: #64748B;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-logo" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 4.5l6.5 3.75v7.5L12 19.5l-6.5-3.75v-7.5z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M9 10h6M12 10v5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 style="font-size: 22px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em">USDT Cloud Miner</h1>
    <p style="font-size: 13px; color: #94A3B8; margin-top: 6px">Admin Console Sign In</p>
  </div>

  <div id="login-error" class="alert-error" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span id="error-message">Invalid email or password</span>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label" for="admin-email">Admin Email</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <input class="form-input" id="admin-email" type="email" placeholder="Enter admin email" required autocomplete="username" autofocus>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="admin-password">Password</label>
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input class="form-input" id="admin-password" type="password" placeholder="Enter password" required autocomplete="current-password" style="padding-right: 44px">
        <button type="button" class="toggle-password" id="toggle-pw-btn" aria-label="Toggle password visibility">
          <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">
      <span id="btn-text">Sign In</span>
      <svg id="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>

  <div class="footer-note">
    Protected Gateway &bull; 256-bit Encrypted Session
  </div>
</div>

<script>
  const SESSION_KEY = 'usdt_admin_session';
  const LOCAL_ACTIVE_KEY = 'usdt_admin_session_active';
  const ADMIN_EMAIL = 'zalavadiyajay3814@gmail.com';
  const VALID_HASH = '6476d17c9993d9f792daf714063e1e539203a77b2e51acfd6772396d7b7a1e9c';

  async function computeSha256(str) {
    try {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {
      return '';
    }
  }

  function isLocallyLoggedIn() {
    try {
      const sess = sessionStorage.getItem(SESSION_KEY);
      if (sess) {
        const parsed = JSON.parse(sess);
        if (parsed && parsed.email && parsed.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) return true;
      }
      if (localStorage.getItem(LOCAL_ACTIVE_KEY) === 'true') return true;
    } catch (e) {}
    return false;
  }

  // Check if already authenticated
  if (isLocallyLoggedIn()) {
    window.location.replace('/index.html');
  } else {
    fetch('/api/session')
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.authenticated) {
          window.location.replace('/index.html');
        }
      }).catch(() => {});
  }

  // Toggle password visibility
  const toggleBtn = document.getElementById('toggle-pw-btn');
  const pwInput = document.getElementById('admin-password');
  toggleBtn.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.innerHTML = isPw ? `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    ` : `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;
  });

  // Handle Login Form Submission
  const form = document.getElementById('login-form');
  const errorAlert = document.getElementById('login-error');
  const errorMessage = document.getElementById('error-message');
  const submitBtn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorAlert.style.display = 'none';
    submitBtn.disabled = true;
    btnText.textContent = 'Verifying...';

    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;

    function handleSuccess() {
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          email: email,
          name: 'Jay Zalavadiya',
          loggedAt: Date.now()
        }));
        localStorage.setItem(LOCAL_ACTIVE_KEY, 'true');
      } catch (err) {}
      btnText.textContent = 'Redirecting...';
      window.location.replace('/index.html');
    }

    function handleFailure(msg) {
      errorMessage.textContent = msg || 'Access denied: invalid credentials';
      errorAlert.style.display = 'flex';
      submitBtn.disabled = false;
      btnText.textContent = 'Sign In';
    }

    // 1. Try server API first
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (response.ok) {
        const data = await response.json();
        if (data && data.success) {
          handleSuccess();
          return;
        } else {
          handleFailure(data.error);
          return;
        }
      } else if (response.status === 401) {
        handleFailure('Access denied: invalid credentials');
        return;
      }
    } catch (networkErr) {
      // Server not reachable (static host)
    }

    // 2. Static Host Cryptographic Fallback (Cloudflare Pages CDN)
    try {
      const hash = await computeSha256(password);
      if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && (hash === VALID_HASH || password === 'Jay@12345')) {
        handleSuccess();
      } else {
        handleFailure('Access denied: invalid credentials');
      }
    } catch (cryptoErr) {
      if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && password === 'Jay@12345') {
        handleSuccess();
      } else {
        handleFailure('Access denied: invalid credentials');
      }
    }
  });
</script>
</body>
</html>
